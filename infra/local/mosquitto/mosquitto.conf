# Local Mosquitto — mTLS only. Anonymous and plaintext clients are rejected.
# Generated CA/server/client material is gitignored and mounted read-only.

listener 8883
protocol mqtt
allow_anonymous false
require_certificate true
use_identity_as_username true

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key

# Persistence is not needed for local command delivery.
persistence false
log_type error
log_type warning
log_type notice
log_type information
