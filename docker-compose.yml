# Local development stack for CyberSixSeven.
# v0.4: Postgres, LocalStack (SNS/SQS/DynamoDB/S3), Mosquitto mTLS.
# Redis and Jaeger arrive in later versions. Pin LocalStack to 4.7 — 2026.03+
# unified images require an auth token this repo does not store.
services:
  postgres:
    image: postgres:17
    container_name: cybersixseven-postgres
    environment:
      POSTGRES_DB: cybersixseven
      POSTGRES_USER: cybersixseven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersixseven"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  localstack:
    image: localstack/localstack:4.7
    container_name: cybersixseven-localstack
    ports:
      - "4566:4566"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      SERVICES: sns,sqs,dynamodb,s3
    volumes:
      - ./infra/local/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cybersixseven-mosquitto
    ports:
      - "8883:8883"
    volumes:
      - ./infra/local/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/local/mosquitto/certs:/mosquitto/certs:ro

# Named volume: without it postgres:17's declared VOLUME lands in an anonymous
# volume that is silently discarded on recreate. Harmless at v0.1; from v0.2
# onward, when Flyway owns the schema, it reads as a migration bug.
volumes:
  postgres-data:
