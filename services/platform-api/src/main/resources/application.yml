server:
  port: 8080

spring:
  application:
    name: platform-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cybersixseven}
    username: ${DB_USERNAME:cybersixseven}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoint:
    health:
      probes:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health
