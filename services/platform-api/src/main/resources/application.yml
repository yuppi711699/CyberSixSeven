server:
  port: 8080

spring:
  application:
    name: platform-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cybersixseven}
    username: ${DB_USERNAME:cybersixseven}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoint:
    health:
      probes:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health

# Exact origins only — never "*". Credentials stay on for later cookie/auth flows.
# Comma-separated for @Value String[] binding. Required — set in repo-root .env (see .env.example).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
