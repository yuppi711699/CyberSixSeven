server:
  port: 8080

spring:
  application:
    name: platform-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cybersixseven}
    username: ${DB_USERNAME:cybersixseven}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoint:
    health:
      probes:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health

# Exact origins only — never "*". Credentials stay on for later cookie/auth flows.
# Comma-separated for @Value String[] binding. Required — set in repo-root .env (see .env.example).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  fixtures:
    enabled: ${APP_FIXTURES_ENABLED:false}
  devices:
    demo-device-id: ${APP_DEMO_DEVICE_ID:esp32-dev-001}
  internal-api-key: ${INTERNAL_API_KEY:}
  command:
    default-intensity: 3
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT:}
    sns-topic-arn: ${SNS_SUBMISSION_EVENTS_TOPIC_ARN:}
