; CyberSixSeven — ESP32 firmware
;
; v0.3: Wi-Fi, NTP, mTLS MQTT, LED/buzzer/motor, LCD (ssd1306 | lcd1602 | st7789), NVS commandId dedup.
; Platform pin is exact. A floating `espressif32` swaps the Arduino core.
;
; LCD_TYPE is a firmware env flag, not a runtime secret.
; Registry (keep in sync with src/lcd_type.h and firmware/esp32/README.md):
;   C67_LCD_TYPE=1  0.96" SSD1306 128x64 OLED          [env:esp32dev]
;   C67_LCD_TYPE=2  16x2 I2C PCF8574A/PCF8574 backpack (or Gravity if RGB present)
;   C67_LCD_TYPE=3  1.54" ST7789 240x240 SPI          [env:esp32dev-st7789]
; Next panel is 4 — do not reuse 1, 2, or 3.
; ST7789 window overrides (only if the picture is wrong — see firmware README):
;   -D C67_ST7789_ROW_START=80    image shoved up, black band at the bottom
;   -D C67_ST7789_MADCTL=0xC0     upside down
;   -D C67_ST7789_MADCTL=0x08     red and blue swapped

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
	-D MQTT_MAX_PACKET_SIZE=512
	-D C67_LCD_TYPE=1
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	knolleary/PubSubClient@2.8

[env:esp32dev-lcd1602]
extends = env:esp32dev
build_flags =
	-D MQTT_MAX_PACKET_SIZE=512
	-D C67_LCD_TYPE=2

[env:esp32dev-st7789]
extends = env:esp32dev
build_flags =
	-D MQTT_MAX_PACKET_SIZE=512
	-D C67_LCD_TYPE=3
