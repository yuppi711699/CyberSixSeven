; CyberSixSeven — ESP32 firmware
;
; v0.3: Wi-Fi, NTP, mTLS MQTT, LED/buzzer/motor/OLED face, NVS commandId dedup.
; Platform pin is exact. A floating `espressif32` swaps the Arduino core.

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
	-D MQTT_MAX_PACKET_SIZE=512
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	knolleary/PubSubClient@2.8
