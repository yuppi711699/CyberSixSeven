; CyberSixSeven — ESP32 firmware
;
; v0.1 scope: join Wi-Fi, blink an external LED once connected, log over serial.
; No MQTT, no TLS, no ArduinoJson, no PubSubClient — those arrive at v0.3.
;
; The platform is pinned to an exact version on purpose. `espressif32` without a
; version resolves to whatever is newest at install time, which swaps the Arduino
; core underneath the firmware and turns a reproducible build into a moving target.
; espressif32 7.1.3 declares `"platformio": "^6"`, so it is compatible with the
; PlatformIO Core 6.2.0 pinned in documents/05-tech-stack.md.

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
