; CyberSixSeven — ESP32 firmware
;
; v0.3: Wi-Fi, NTP, mTLS MQTT, LED/buzzer/motor, LCD (ssd1306 | lcd1602), NVS commandId dedup.
; Platform pin is exact. A floating `espressif32` swaps the Arduino core.
;
; LCD_TYPE is a firmware env flag, not a runtime secret.
; Registry (keep in sync with src/lcd_type.h and firmware/esp32/README.md):
;   C67_LCD_TYPE=1  0.96" SSD1306 128x64 OLED          [env:esp32dev]
;   C67_LCD_TYPE=2  HD44780 1602 + PCF8574 I2C backpack [env:esp32dev-lcd1602]
; Next panel is 3 — do not reuse 1 or 2.

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
	-D MQTT_MAX_PACKET_SIZE=512
	-D C67_LCD_TYPE=1
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	knolleary/PubSubClient@2.8

[env:esp32dev-lcd1602]
extends = env:esp32dev
build_flags =
	-D MQTT_MAX_PACKET_SIZE=512
	-D C67_LCD_TYPE=2
